[package]
name = "nxms-peer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "NXMS peer tool: initiates escrow tx_sign_req flows to signers over the mailbox"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
nxms-mailbox-client = { path = "../nxms-mailbox-client" }
nxms-transport = { path = "../nxms-transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
